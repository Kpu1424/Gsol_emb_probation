# Layer cấu hình cho bài học Yocto: meta-sensor
# Thêm thư mục layer này vào BBPATH để BitBake tìm thấy conf/ và classes/
BBPATH .= ":${LAYERDIR}"

# Các file recipe (.bb) và phần mở rộng recipe (.bbappend) của layer
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sensor"
BBFILE_PATTERN_meta-sensor = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sensor = "10"

LAYERDEPENDS_meta-sensor = "core"

# PHẢI khớp tên release Yocto của BSP (xem LAYERSERIES_CORENAMES trong poky/meta/conf/layer.conf).
# dunfell = 3.1, kirkstone = 4.0, scarthgap = 5.0. Xóa các tên không dùng khi đã chọn BSP.
LAYERSERIES_COMPAT_meta-sensor = "dunfell kirkstone scarthgap"
